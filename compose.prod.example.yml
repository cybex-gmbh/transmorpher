services:
  app:
    image: cybexwebdev/transmorpher:x.x-app
    restart: unless-stopped
    volumes:
      # If you are using local disks, persist the storage across container restarts.
      - 'storage:/var/www/storage'
      - './.env:/var/www/.env:ro'
    networks:
      - external
    # If you are using Traefik.
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.transmorpher.rule=Host(`${TRAEFIK_HOST}`)'
      - 'traefik.http.routers.transmorpher.tls=true'
      - 'traefik.http.routers.transmorpher.tls.certresolver=${TRAEFIK_CERT_RESOLVER}'

  worker-transcoding:
    image: cybexwebdev/transmorpher:x.x-transcoder
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: worker
      SERVICE_INSTANCES: ${VIDEO_TRANSCODING_WORKERS_AMOUNT:-1}
      QUEUE: ${TRANSMORPHER_VIDEO_TRANSCODING_QUEUE:-video-transcoding}
      QUEUE_CONNECTION: ${TRANSMORPHER_VIDEO_TRANSCODING_QUEUE_CONNECTION:-${QUEUE_CONNECTION}}
    volumes:
      # If you are using local disks, persist the storage across container restarts.
      - 'storage:/var/www/storage'
      - './.env:/var/www/.env:ro'
    networks:
      - external

  worker-client-notifications:
    image: cybexwebdev/transmorpher:x.x-app
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: worker
      SERVICE_INSTANCES: 1
      QUEUE: ${TRANSMORPHER_CLIENT_NOTIFICATIONS_QUEUE:-client-notifications}
      QUEUE_CONNECTION: ${TRANSMORPHER_CLIENT_NOTIFICATIONS_QUEUE_CONNECTION:-${QUEUE_CONNECTION}}
    volumes:
      - './.env:/var/www/.env:ro'
    networks:
      - external

  worker-email:
    image: cybexwebdev/transmorpher:x.x-app
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: worker
      SERVICE_INSTANCES: 1
      QUEUE: ${TRANSMORPHER_EMAIL_QUEUE:-email}
      QUEUE_CONNECTION: ${TRANSMORPHER_EMAIL_QUEUE_CONNECTION:-${QUEUE_CONNECTION}}
    volumes:
      - './.env:/var/www/.env:ro'
    networks:
      - external

  scheduler:
    image: cybexwebdev/transmorpher:x.x-app
    restart: unless-stopped
    environment:
      CONTAINER_ROLE: scheduler
    volumes:
      # Needs storage for cleaning up chunk files.
      - 'storage:/var/www/storage'
      - './.env:/var/www/.env:ro'

networks:
  external:
    name: external

volumes:
  storage:
    driver: local
