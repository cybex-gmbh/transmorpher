x-common: &common
  depends_on:
    mariadb:
      condition: service_healthy
    traefik:
      condition: service_started
  volumes:
    - 'storage:/var/www/storage'
  networks: &common-networks
    - traefik
    - internal

x-common-build: &common-build
  context: .
  dockerfile: docker/prod/Dockerfile

x-app-url: &app-url
  APP_URL: https://transmorpher.${PULLPREVIEW_PUBLIC_DNS}

services:
  app:
    <<: *common
    build:
      <<: *common-build
      target: app
    environment:
      <<: *app-url
      CONTAINER_ROLE: web

  worker-transcoding:
    <<: *common
    build:
      <<: *common-build
      target: transcoder
    environment:
      <<: *app-url
      CONTAINER_ROLE: worker
      SERVICE_INSTANCES: ${VIDEO_TRANSCODING_WORKERS_AMOUNT:-1}
      QUEUE: video-transcoding

  worker-client-notifications:
    <<: *common
    build:
      <<: *common-build
      target: app
    environment:
      <<: *app-url
      CONTAINER_ROLE: worker
      SERVICE_INSTANCES: 1
      QUEUE: client-notifications

  worker-email:
    <<: *common
    build:
      <<: *common-build
      target: app
    environment:
      <<: *app-url
      CONTAINER_ROLE: worker
      SERVICE_INSTANCES: 1
      QUEUE: email

  scheduler:
    <<: *common
    build:
      <<: *common-build
      target: app
    environment:
      <<: *app-url
      CONTAINER_ROLE: scheduler

  initialize:
    <<: *common
    build:
      <<: *common-build
      target: app
    command: [ '/var/www/docker/prod/pullpreview.initialize.sh' ]
    restart: 'on-failure'
    environment:
      <<: *app-url
      CLIENT_CONTAINER_NAME: ${COMPOSE_PROJECT_NAME}-amigor
      PULLPREVIEW: true
      PULLPREVIEW_FIRST_RUN: ${PULLPREVIEW_FIRST_RUN}
    networks:
      - internal

  mariadb:
    image: 'mariadb:lts-noble'
    environment:
      MARIADB_DATABASE: '${DB_DATABASE}'
      MARIADB_USER: '${DB_USERNAME}'
      MARIADB_PASSWORD: '${DB_PASSWORD}'
      MARIADB_ROOT_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'mariadb:/var/lib/mysql'
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      retries: 3
      timeout: 5s

  ########################################################################## Amigor ##########################################################################

  amigor:
    container_name: ${COMPOSE_PROJECT_NAME}-amigor
    image: 'cybexwebdev/transmorpher-amigor'
    depends_on:
      amigor-mysql:
        condition: service_healthy
      traefik:
        condition: service_started
    environment:
      APP_URL: https://${PULLPREVIEW_PUBLIC_DNS}
      PULLPREVIEW: true
      PULLPREVIEW_FIRST_RUN: ${PULLPREVIEW_FIRST_RUN}
      TRANSMORPHER_WEB_DELIVERY_BASE_URL: https://transmorpher.${PULLPREVIEW_PUBLIC_DNS}
      TRANSMORPHER_WEB_API_BASE_URL: https://transmorpher.${PULLPREVIEW_PUBLIC_DNS}/api
    volumes:
      - 'amigor-storage:/var/www/html/amigor/storage'
      - '.env.amigor:/var/www/html/amigor/.env'
    networks: *common-networks

  amigor-mysql:
    image: 'mysql/mysql-server:8.0'
    environment:
      MYSQL_ROOT_PASSWORD: 'password'
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: 'amigor'
      MYSQL_USER: 'amigor'
      MYSQL_PASSWORD: 'password'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - 'amigor-mysql:/var/lib/mysql'
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-ppassword" ]
      retries: 3
      timeout: 5s

  ########################################################################## Traefik ##########################################################################

  traefik:
    image: traefik:mimolette
    ports:
      - '80:80'
      - '443:443'
    environment:
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: false
      TRAEFIK_LOG: true
      TRAEFIK_LOG_FILEPATH: '/logs/traefik.log'
      TRAEFIK_LOG_LEVEL: DEBUG
      TRAEFIK_API: false
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION: true
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_EMAIL: 'cloud@cybex-online.com'
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_CASERVER: 'https://acme-v02.api.letsencrypt.org/directory'
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_STORAGE: 'acme.json'
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_HTTPCHALLENGE: true
      TRAEFIK_CERTIFICATESRESOLVERS_PRODUCTION_ACME_HTTPCHALLENGE_ENTRYPOINT: web
      TRAEFIK_ENTRYPOINTS_WEB: true
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ':80'
      TRAEFIK_ENTRYPOINTS_WEB_HTTP: true
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_TO: websecure
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_REDIRECTIONS_ENTRYPOINT_SCHEME: https
      TRAEFIK_ENTRYPOINTS_WEBSECURE: true
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ':443'
      TRAEFIK_PROVIDERS_FILE: 'true'
      TRAEFIK_PROVIDERS_FILE_FILENAME: /etc/traefik/pullpreview.traefik.yml
      TRAEFIK_PROVIDERS_FILE_WATCH: 'true'
    volumes:
      - ./storage/logs:/logs
      - ./.htpasswd:/.htpasswd:ro
      - ./pullpreview.traefik.yml:/etc/traefik/pullpreview.traefik.yml:ro
      # Needs to be mounted so that it is synced to the server for use in the pre-script
      - ./pullpreview.traefik.template.yml:/pullpreview.traefik.template.yml:ro
    networks:
      - traefik

########################################################################## Networks & Volumes ##########################################################################

networks:
  internal:
    internal: true
  traefik:
    name: traefik

volumes:
  mariadb:
    driver: local
  amigor-mysql:
    driver: local
  storage:
    driver: local
  amigor-storage:
    driver: local
