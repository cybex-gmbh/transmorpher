name: Docker Image CI

on:
  release:
    types: [ published ]

env:
  DOCKER_REPOSITORY: cybexwebdev/transmorpher

jobs:
  production-images:
    runs-on: ubuntu-latest

    steps:
      # Needed for caching, fails without.
      - name: Setup Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        # https://github.com/docker/login-action
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fetch release tag marked as latest
        run: |
          echo "LATEST_TAG=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/latest" \
          | jq -r .tag_name)" >> $GITHUB_ENV

      - name: Specify docker image tags
        id: meta
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REPOSITORY }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref_name == env.LATEST_TAG }}
            type=semver,pattern={{major}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}}
            type=sha

      - name: Extract major.minor version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=${TAG#v} # Remove 'v' prefix if present
          MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/bake-action@v7
        env:
          CACHE_KEY: ${{ steps.version.outputs.major_minor }}
        with:
          files: |
            docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: default
          push: true

      - name: Sync README with Docker Hub description
        if: ${{ github.ref_name == env.LATEST_TAG }}
        # https://github.com/peter-evans/dockerhub-description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKER_REPOSITORY }}
          short-description: ${{ github.event.repository.description }}
