name: Docker Image CI

on:
  delete:
  push:
    branches:
      - 'preview/**'

jobs:
  branch-images:
    if: ${{ startsWith(github.ref_name, 'preview/')}}
    runs-on: ubuntu-latest

    steps:
      - name: Get branch name
        run: echo "BRANCH_NAME=$(echo ${{ github.ref_name }} | tr / -)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        # https://github.com/docker/login-action
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Fetch release tag marked as latest
        run: |
          echo "LATEST_TAG=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/releases/latest" \
          | jq -r .tag_name)" >> $GITHUB_ENV

      - name: Specify docker image tags
        id: meta-branch
        # https://github.com/docker/metadata-action
        uses: docker/metadata-action@v6
        with:
          images: |
            cybexwebdev/transmorpher
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.BRANCH_NAME }}
            type=sha

      - name: Build
        uses: docker/bake-action@v7
        with:
          files: |
            docker-bake.hcl
            cwd://${{ steps.meta-branch.outputs.bake-file }}
          targets: default
          push: true

  delete-branch-images:
    if: ${{ github.event_name == 'delete' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'preview/') }}
    runs-on: ubuntu-latest

    steps:
      - name: Delete docker images which were created for a branch
        env:
          BRANCH: ${{ github.event.ref }}
        run: |
          MODIFIED_BRANCH_NAME=${BRANCH/\//-}
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username": "'${{ secrets.DOCKERHUB_USERNAME }}'", "password": "'${{ secrets.DOCKERHUB_TOKEN }}'"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
          curl -s -X DELETE -H "Authorization: Bearer ${TOKEN}" https://hub.docker.com/v2/repositories/cybexwebdev/transmorpher/tags/${MODIFIED_BRANCH_NAME}-app/
          curl -s -X DELETE -H "Authorization: Bearer ${TOKEN}" https://hub.docker.com/v2/repositories/cybexwebdev/transmorpher/tags/${MODIFIED_BRANCH_NAME}-transcoder/
