# Public server: port 80
server {
    listen       ${PUBLIC_LISTEN} default_server;
    server_name  _;

    root   /var/www/public;
    index  index.php index.html;

    # Deny sensitive files
    location ~ /(\.env|\.git|\.hg|\.svn|backup|storage/.*|vendor/.*) { deny all; }

    # Serve static files directly
    location ~* \.(?:jpg|jpeg|gif|png|webp|svg|ico|css|js|map|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        try_files $uri $uri/ =404;
    }

    # Serve transmorpher video manifests
    location ~* ^/videos/.*\.(?:m3u8|mpd)$ {
        add_header Cache-Control "public, max-age=1440, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        add_header Access-Control-Allow-Origin "*" always;

        try_files $uri =404;
    }

    # Serve transmorpher video segments
    location ~* ^/videos/.*\.(?:ts|m4s|mp4)$ {
        add_header Cache-Control "public, max-age=1440, must-revalidate" always;
        add_header Vary "Accept-Encoding" always;
        add_header Accept-Ranges "bytes" always;
        add_header Access-Control-Allow-Origin "*" always;

        try_files $uri =404;
    }

    # Front controller for Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM upstream (env-driven)
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;

        # Use env-configured upstream; e.g., 127.0.0.1:9000 in php-laravel, app:9000 in nginx-only
        fastcgi_pass ${FPM_UPSTREAM};
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_index index.php;
    }

    # Security headers (can be adjusted per app)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml;
}

# Internal-only healthcheck and status server: loopback on 8080
server {
    listen ${HEALTH_LISTEN};
    server_name _;

    # Only allow local access (e.g. from the container itself)
    allow 127.0.0.1;
    deny all;

    location /healthcheck {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /ping;
        fastcgi_param SCRIPT_FILENAME /ping;
        fastcgi_param REQUEST_URI /ping;
        fastcgi_pass ${FPM_STATUS_UPSTREAM};
    }

    location /status {
        access_log off;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /status;
        fastcgi_param SCRIPT_FILENAME /status;
        fastcgi_param REQUEST_URI /status;
        fastcgi_pass ${FPM_STATUS_UPSTREAM};
    }
}
